name: Native LAN UI profile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Test publication and byte-preservation guards
        run: python -B -m unittest discover -s tools -p "test_*.py"
      - name: Build and test all six modern native targets
        shell: bash
        working-directory: source/e4steam
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon apiChecks test headlessEntrypointAudit releaseJars --console=plain
      - name: Fetch and verify all nineteen original artifacts
        run: python -B tools/components.py stage --out dist/originals
      - name: Derive and verify the complete native UI profile
        shell: bash
        run: |
          python -B tools/native_ui.py stage --originals dist/originals
          python -B tools/native_ui.py verify --originals dist/originals
      - uses: actions/upload-artifact@v4
        with:
          name: native-lan-ui-${{ matrix.os }}
          path: dist/native-lan-ui-v1
